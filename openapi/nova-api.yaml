          caller''s first active membership is used. When supplied, the caller must
          hold an active membership in that tenant (otherwise tenant-scoped endpoints
          respond 403/400).'
      - in: query
        name: folder_id
        schema:
          type: string
        description: Restrict to a folder UUID. Use `root`, `null` or `none` for files
          outside any folder; `all` disables folder filtering. `folder` is an alias.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - assets
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssetListEnvelope'
          description: ''
        '400':
          description: Validation failed or tenant context is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded; honour the Retry-After header.
          content:
            application/json:
              schema:
