          - CREATE
          - DELETE
          - DOWNLOAD
          - EXPORT
          - READ
          - SYSTEM
          - UPDATE
          - UPLOAD
        description: Filter by activity category.
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Return only logs created after this timestamp.
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: Return only logs created before this timestamp.
