openapi: 3.0.3
info:
  title: Nova — Dynamic Email & Delivery Platform API
  version: 1.0.0
  description: Production-grade REST API backend for dynamic email template management,
    tenant isolation, variable rendering safety, and resilient multi-provider delivery
    routing.
paths:
  /api/v1/analytics/dashboard/:
    get:
      operationId: analytics_dashboard_retrieve
      description: Returns aggregated totals, email delivery funnel metrics, recent
        contacts, and recent failed messages.
      summary: Retrieve Dashboard Analytics & Card Overview Metrics
      parameters:
      - in: header
        name: X-Tenant-ID
        schema:
          type: string
        description: 'Active organization / tenant UUID. Optional: when omitted, the
          caller''s first active membership is used. When supplied, the caller must
          hold an active membership in that tenant (otherwise tenant-scoped endpoints
          respond 403/400).'
      - in: query
        name: date_from
        schema:
          type: string
        description: Filter start date (YYYY-MM-DD or ISO 8601 string)
      - in: query
        name: date_to
        schema:
          type: string
        description: Filter end date (YYYY-MM-DD or ISO 8601 string)
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsEnvelope'
          description: ''
        '400':
          description: Validation failed or tenant context is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded; honour the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, invalid, or expired credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated but not permitted (role or tenant access).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/assets/files/:
    get:
      operationId: assets_files_list
      description: |-
        CRUD ViewSet for tenant media file assets.
        Supports file uploads, folder filtering, file detail viewing, and file deletion.
      parameters:
      - in: header
        name: X-Tenant-ID
        schema:
