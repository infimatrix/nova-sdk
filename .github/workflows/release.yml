name: Release

# Manual only. Publishes one SDK to Google Cloud Artifact Registry from an existing tag:
#   Actions > Release > Run workflow > "Use workflow from": pick the tag, then choose the SDK.
#   python-vX.Y.Z      -> Python repository (format: python)
#   typescript-vX.Y.Z  -> npm repository    (format: npm)
#   java-vX.Y.Z        -> Maven repository  (format: maven)
# Authentication is keyless (Workload Identity Federation); no long-lived keys are stored.
# Every job runs in the "release" environment, so configure required reviewers on it for a manual approval gate.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#   GCP_SERVICE_ACCOUNT             nova-sdk-publisher@<PROJECT>.iam.gserviceaccount.com
#   AR_PROJECT, AR_LOCATION         Artifact Registry project and location
#   AR_PYTHON_REPOSITORY, AR_NPM_REPOSITORY, AR_MAVEN_REPOSITORY
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK to publish (the selected tag must be <sdk>-vX.Y.Z)"
        type: choice
        required: true
        options: [python, typescript, java]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AR_PROJECT: ${{ vars.AR_PROJECT }}
  AR_LOCATION: ${{ vars.AR_LOCATION }}

jobs:
  python:
    name: Publish Python
    if: inputs.sdk == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      AR_REPOSITORY: ${{ vars.AR_PYTHON_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require registry configuration and a tag on main
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::run this workflow from a tag, not a branch"; exit 1; }
          for v in AR_PROJECT AR_LOCATION AR_REPOSITORY; do [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }; done
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
      - name: Tag matches package version
        run: |
          version=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' sdks/python/src/nova_sdk/_version.py)
          [ "${GITHUB_REF_NAME}" = "python-v${version}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Test, lint and build
        working-directory: sdks/python
        run: |
          pip install -e ".[dev]" build twine
          ruff check . && ruff format --check . && mypy
          pytest -p no:cacheprovider
          python -m build
          twine check dist/*
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Upload to Artifact Registry
        working-directory: sdks/python
        env:
          TWINE_USERNAME: oauth2accesstoken
          TWINE_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: twine upload --repository-url "https://${AR_LOCATION}-python.pkg.dev/${AR_PROJECT}/${AR_REPOSITORY}/" dist/*

  typescript:
    name: Publish TypeScript
    if: inputs.sdk == 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      AR_REPOSITORY: ${{ vars.AR_NPM_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require registry configuration and a tag on main
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::run this workflow from a tag, not a branch"; exit 1; }
          for v in AR_PROJECT AR_LOCATION AR_REPOSITORY; do [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }; done
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
      - name: Tag matches package version
        run: |
          version=$(node -p "require('./sdks/typescript/package.json').version")
          [ "${GITHUB_REF_NAME}" = "typescript-v${version}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Test and build
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run check:package
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Publish to Artifact Registry (prepublishOnly guard checks the registry host)
        working-directory: sdks/typescript
        env:
          AR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          registry="${AR_LOCATION}-npm.pkg.dev/${AR_PROJECT}/${AR_REPOSITORY}/"
          {
            echo "@infimatrix:registry=https://${registry}"
            echo "//${registry}:_authToken=\${AR_ACCESS_TOKEN}"
          } > .npmrc
          npm publish
          rm -f .npmrc

  java:
    name: Publish Java
    if: inputs.sdk == 'java'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      AR_REPOSITORY: ${{ vars.AR_MAVEN_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require registry configuration and a tag on main
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::run this workflow from a tag, not a branch"; exit 1; }
          for v in AR_PROJECT AR_LOCATION AR_REPOSITORY; do [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }; done
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tag matches pom version
        working-directory: sdks/java
        run: |
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ "${GITHUB_REF_NAME}" = "java-v${version}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} != pom version ${version}"; exit 1; }
      - name: Verify (build, test, checkstyle, javadoc)
        working-directory: sdks/java
        run: mvn -B -ntp verify
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Deploy to Artifact Registry
        working-directory: sdks/java
        env:
          AR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>artifact-registry</id>
                <username>oauth2accesstoken</username>
                <password>${env.AR_ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          mvn -B -ntp -s "$RUNNER_TEMP/settings.xml" deploy -DskipTests -Partifact-registry \
            -Dar.project="$AR_PROJECT" -Dar.location="$AR_LOCATION" -Dar.repository="$AR_REPOSITORY"
