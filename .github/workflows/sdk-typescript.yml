name: SDK - TypeScript

on:
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "openapi/**"
      - "scripts/gen_ts_types.py"
      - "scripts/check_sdk_coverage.py"
      - ".github/workflows/sdk-typescript.yml"
  push:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - "openapi/**"
      - "scripts/gen_ts_types.py"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package

  runtime-floor:
    name: Node 18 runtime smoke test (built package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: "18.17"
      - name: Import and construct the client on the minimum supported Node
        run: node -e "const {NovaClient,VERSION}=require('./dist/index.cjs'); new NovaClient({apiKey:'k'}); console.log('node', process.version, 'sdk', VERSION)"

  generated-code:
    name: Generated types are reproducible and cover the contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/gen_ts_types.py --check
      - run: python scripts/check_sdk_coverage.py --sdk typescript --strict

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - name: Production dependencies (the package has none)
        run: npm audit --omit=dev --audit-level=low
      - name: Dev tooling
        run: npm audit --audit-level=high
