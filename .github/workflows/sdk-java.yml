name: SDK - Java

on:
  pull_request:
    paths:
      - "sdks/java/**"
      - "openapi/**"
      - "scripts/gen_java_models.py"
      - "scripts/check_sdk_coverage.py"
      - ".github/workflows/sdk-java.yml"
  push:
    branches: [main]
    paths:
      - "sdks/java/**"
      - "openapi/**"
      - "scripts/gen_java_models.py"

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, coverage check, checkstyle, javadoc, package (no deploy)
        run: mvn -B -ntp verify

  generated-code:
    name: Generated models are reproducible and cover the contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/gen_java_models.py --check
      - run: python scripts/check_sdk_coverage.py --sdk java --strict

  package-smoke:
    name: Consume the built JAR from a separate project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and install into a throw-away local repository (not a publish)
        working-directory: sdks/java
        run: mvn -B -ntp -DskipTests -Dmaven.repo.local="$RUNNER_TEMP/m2" install
      - name: Compile and run a consumer
        run: sdks/java/scripts/smoke-test.sh "$RUNNER_TEMP/m2"
