version: 2
updates:
  - package-ecosystem: pip
    directory: /sdks/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /sdks/java
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
