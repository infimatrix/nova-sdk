[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infimatrix-nova-sdk"
dynamic = ["version"]
description = "Official Python SDK for Nova — Dynamic Email Template & Email Delivery Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["nova", "email", "templates", "api", "sdk"]
authors = [
    { name = "Nova Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    # Safeguard: the public PyPI rejects uploads of projects carrying this classifier.
    # Nova SDKs are distributed only through Google Cloud Artifact Registry.
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/infimatrix/nova-sdk"
Repository = "https://github.com/infimatrix/nova-sdk"
Issues = "https://github.com/infimatrix/nova-sdk/issues"
Changelog = "https://github.com/infimatrix/nova-sdk/blob/main/sdks/python/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17,<0.18",
    "mypy>=1.13",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "nova_sdk._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova_sdk = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
files = ["src/nova_sdk"]
warn_unused_ignores = true
warn_redundant_casts = true
